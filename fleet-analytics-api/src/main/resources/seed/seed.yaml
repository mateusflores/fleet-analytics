permissions:
  - name: "users:create"
    description: "Create new users"
  - name: "users:read"
    description: "View user details"
  - name: "users:management"
    description: "Enable or disable user accounts"
  - name: "analytics:view"
    description: "View analytics and reports"
  - name: "travel:start"
    description: "Start a travel"
  - name: "travel:read"
    description: "View travel details"
  - name: "drivers:view"
    description: "View driver list and details"
  - name: "drivers:create"
    description: "Create new drivers"
  - name: "drivers:update"
    description: "Update driver information"
  - name: "vehicles:view"
    description: "View vehicle list and details"
  - name: "vehicles:create"
    description: "Create new vehicles"
  - name: "vehicles:update"
    description: "Update vehicle information"
  - name: "roles:create"
    description: "Create new roles"
  - name: "roles:read"
    description: "View roles and permissions"
  - name: "roles:update"
    description: "Update roles and permissions"
  - name: "roles:delete"
    description: "Delete roles"

roles:
  - name: "Admin"
    permissions: "*"
  - name: "Analyst"
    permissions:
      - "analytics:view"
      - "drivers:view"
      - "vehicles:view"
      - "travel:read"
  - name: "Driver"
    permissions:
      - "travel:start"
      - "travel:read"
      - "vehicles:view"

admin:
  username: "admin"
  email: "admin@fleet.com"
  passwordEnvVar: "ADMIN_PASSWORD"
  roleName: "Admin"
