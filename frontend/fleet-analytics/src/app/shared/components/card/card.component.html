<section class="card">
  <div class="card-content-meta">
    <mat-icon [style.color]="iconColor" [style.backgroundColor]="getIconBackgroundColor()"
      class="card-content-meta-icon">
      {{ icon }}
    </mat-icon>
    <span class="card-content-meta-text">{{ title }}</span>
  </div>
  <div class="card-content-value">
    <h1>{{ value }}</h1>
  </div>
</section>
