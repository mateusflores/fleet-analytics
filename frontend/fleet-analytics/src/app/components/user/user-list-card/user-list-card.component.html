<mat-card class="user-card" role="button" tabindex="0" (click)="onDetails()" (keydown.enter)="onDetails()" (keydown.space)="onDetails()">
  <div class="user-card-header">
    <div class="user-icon-wrap">
      <mat-icon>person</mat-icon>
    </div>
    <div class="user-card-actions">
      @if (user.enabled) {
        <button
          mat-icon-button
          type="button"
          aria-label="Desabilitar usuário"
          [disabled]="isToggling"
          (click)="onDisable($event)"
        >
          <mat-icon>block</mat-icon>
        </button>
      } @else {
        <button
          mat-icon-button
          type="button"
          aria-label="Habilitar usuário"
          [disabled]="isToggling"
          (click)="onEnable($event)"
        >
          <mat-icon>check_circle</mat-icon>
        </button>
      }
    </div>
  </div>

  <h2 class="user-name">{{ user.firstName }} {{ user.lastName }}</h2>

  <dl class="user-details">
    <div class="detail-row">
      <dt>Usuário</dt>
      <dd>{{ user.username }}</dd>
    </div>
    <div class="detail-row">
      <dt>E-mail</dt>
      <dd>{{ user.email }}</dd>
    </div>
    <div class="detail-row">
      <dt>Telefone</dt>
      <dd>{{ user.phone }}</dd>
    </div>
  </dl>

  <div class="user-meta">
    <span class="user-role">{{ user.roleName }}</span>
    <span class="user-status" [class.enabled]="user.enabled" [class.disabled]="!user.enabled">
      {{ user.enabled ? 'Ativo' : 'Inativo' }}
    </span>
  </div>
</mat-card>
