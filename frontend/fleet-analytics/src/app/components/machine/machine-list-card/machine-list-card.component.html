<mat-card class="machine-card" (click)="onOpenDetails()" style="cursor: pointer;">
  <div class="machine-card-header">
    <div class="machine-icon-wrap">
      <mat-icon>precision_manufacturing</mat-icon>
    </div>

    <span class="machine-status" [class.is-offline]="!machine.active">
      <span class="status-dot"></span>
      {{ machine.active ? 'Online' : 'Offline' }}
    </span>
  </div>

  <h2 class="machine-name">{{ machine.nickname }}</h2>
  <p class="machine-code">{{ machine.serialNumber }}</p>

  <dl class="machine-meta">
    <div class="meta-row">
      <dt>Placa</dt>
      <dd>{{ machine.licensePlate }}</dd>
    </div>
    <div class="meta-row">
      <dt>Marca</dt>
      <dd>{{ machine.brand }}</dd>
    </div>
    <div class="meta-row">
      <dt>Modelo</dt>
      <dd>{{ machine.model }}</dd>
    </div>
    <div class="meta-row">
      <dt>Tipo</dt>
      <dd>{{ machine.vehicleType | machineTypeLabel }}</dd>
    </div>
    <div class="meta-row">
      <dt>Modelo</dt>
      <dd>{{ machine.renavam }}</dd>
    </div>
  </dl>
</mat-card>
